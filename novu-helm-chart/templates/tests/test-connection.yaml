apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-smoke-test"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          set -eux

          echo "Testing API..."
          curl -f curl http://novu-api.novu.svc.cluster.local:3000/v1/health-check

          echo "Testing Worker..."
          curl -f curl http://novu-worker.novu.svc.cluster.local:3004/v1/health-check

          echo "Testing WS..."
          curl -f curl http://novu-ws.novu.svc.cluster.local:3002/v1/health-check

          echo "Testing Dashboard..."
          curl -f curl http://novu-dashboard.novu.svc.cluster.local:4000/v1/health-check

          echo "All tests passed"
